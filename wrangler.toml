# Cloudflare Worker config. The Worker (server/worker.ts) answers /api/*;
# everything else is the built site in dist/, served as static assets with
# the headers in public/_headers. Secrets come from .dev.vars locally and from
# the Worker's "Variables and Secrets" settings on Cloudflare.
name = "clearance"
main = "server/worker.ts"
compatibility_date = "2026-09-01"

# Serve the app at https://clearance.<your-subdomain>.workers.dev
workers_dev = true
# No extra public preview addresses for each upload.
preview_urls = false
# Keep variables set in the Cloudflare dashboard (like TUTOR_MODEL) when deploying.
keep_vars = true

# `wrangler deploy` and `wrangler dev` build the site first, so a deploy never
# uploads a stale or missing dist/.
[build]
command = "npm run build"
watch_dir = ["src", "server", "shared", "prompts", "public"]

[assets]
directory = "./dist"
binding = "ASSETS"
# Only /api goes through the Worker code; files are served directly.
run_worker_first = ["/api/*"]

[dev]
port = 8788

# Sync between devices: tabs and settings per logged-in email (server/sync.ts).
# A database of its own, created for Clearance; the account's other database isn't used.
[[d1_databases]]
binding = "DB"
database_name = "clearance"
database_id = "2717fa27-7ba6-427e-b199-51121db4f5e5"

# Cloudflare Access (Zero Trust login). Not secret: they identify your login page and
# the Access application, so the Worker can check that a login token is really from
# Cloudflare and for this app. Sync stays off until ACCESS_AUD is set.
[vars]
ACCESS_TEAM_DOMAIN = "aged-union-528e.cloudflareaccess.com"
