<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "Maskable" version: phones crop icons into circles or squircles, so the
       background fills the whole square and the slashes stay in the safe middle. -->
  <rect width="32" height="32" fill="#121828"/>
  <g transform="translate(16 16) scale(0.62) translate(-16 -16)">
    <polygon points="6.5,26 10.5,26 17,6 13,6" fill="#2EF2D0"/>
    <polygon points="15,26 19,26 25.5,6 21.5,6" fill="#2EF2D0"/>
  </g>
</svg>
